name: Chart Contract

on:
  pull_request:
    paths:
      - 'charts/**/*.yaml'
      - 'charts/**/*.tpl'
      - 'charts/**/templates/**'
      - '.github/scripts/**/*.py'
      - 'tests/chart_contract/**'
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'

jobs:
  chart-contract:
    name: Chart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run chart contract tests
        run: python3 -m pytest tests/chart_contract

      - name: Validate changed chart release versions
        run: python3 .github/scripts/validate_chart_release_versions.py --base "origin/${{ github.base_ref }}"
