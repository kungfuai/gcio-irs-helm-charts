name: Chart Contract

on:
  pull_request:
    paths:
      - 'charts/**/*.yaml'
      - 'charts/**/*.tpl'
      - 'charts/**/templates/**'
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'

jobs:
  chart-contract:
    name: Chart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*; do
            helm lint "$chart"
          done

      - name: Validate worker non-http contract
        run: |
          rendered="$(mktemp)"
          helm template worker ./charts/worker \
            --set aws.s3Bucket=contract-bucket \
            --set aws.sqs.workerQueueURL=https://example.com/worker-queue \
            --set aws.sqs.statusQueueURL=https://example.com/status-queue \
            >"${rendered}"

          ruby - "${rendered}" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          docs = YAML.load_stream(File.read(path))
          deployment = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "worker"
          end

          raise "worker deployment missing from rendered chart" if deployment.nil?

          container = deployment.dig("spec", "template", "spec", "containers", 0)
          raise "worker container missing from rendered chart" if container.nil?

          raise "worker deployment still emits livenessProbe" if container.key?("livenessProbe")
          raise "worker deployment still emits readinessProbe" if container.key?("readinessProbe")
          RUBY
