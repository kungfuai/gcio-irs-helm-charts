name: Chart Contract

on:
  pull_request:
    paths:
      - 'charts/**/*.yaml'
      - 'charts/**/*.tpl'
      - 'charts/**/templates/**'
      - '.github/workflows/**/*.yml'
      - '.github/workflows/**/*.yaml'

jobs:
  chart-contract:
    name: Chart Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*; do
            helm lint "$chart"
          done

      - name: Validate worker non-http contract
        run: |
          rendered="$(mktemp)"
          helm template worker ./charts/worker \
            --set aws.s3Bucket=contract-bucket \
            --set aws.sqs.workerQueueURL=https://example.com/worker-queue \
            --set aws.sqs.statusQueueURL=https://example.com/status-queue \
            >"${rendered}"

          ruby - "${rendered}" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          docs = YAML.load_stream(File.read(path))
          deployment = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "worker"
          end

          raise "worker deployment missing from rendered chart" if deployment.nil?

          container = deployment.dig("spec", "template", "spec", "containers", 0)
          raise "worker container missing from rendered chart" if container.nil?

          raise "worker deployment still emits livenessProbe" if container.key?("livenessProbe")
          raise "worker deployment still emits readinessProbe" if container.key?("readinessProbe")
          RUBY

      - name: Validate Ospere hook contract
        run: |
          rendered="$(mktemp)"
          helm template ospere ./charts/ospere \
            --namespace ospere \
            -f ./charts/ospere/ci/all-values.yaml \
            --set jobs.ensureAdmin.create=true \
            --set jobs.ensureAdmin.existingSecret=ospere-admin-bootstrap \
            >"${rendered}"

          ruby - "${rendered}" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          docs = YAML.load_stream(File.read(path))
          migration = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Job" && doc.dig("metadata", "name") == "ospere-migrate"
          end

          raise "ospere migration job missing from rendered chart" if migration.nil?

          migration_annotations = migration.dig("metadata", "annotations") || {}
          raise "ospere migration hook must run before install and upgrade" unless migration_annotations["helm.sh/hook"] == "pre-install,pre-upgrade"
          raise "ospere migration hook weight must be 8" unless migration_annotations["helm.sh/hook-weight"] == "8"

          pod_spec = migration.dig("spec", "template", "spec")
          raise "ospere migration pod spec missing from rendered chart" if pod_spec.nil?

          if pod_spec.key?("serviceAccountName")
            raise "ospere pre-install migration hook must not reference chart-created serviceAccountName by default"
          end

          migration_container = pod_spec.dig("containers", 0)
          raise "ospere migration container missing from rendered chart" if migration_container.nil?
          raise "ospere migration hook must use lockedmigrate" unless migration_container["command"] == ["python", "manage.py", "lockedmigrate", "--noinput"]

          ensure_admin = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Job" && doc.dig("metadata", "name") == "ospere-ensure-admin"
          end

          raise "ospere ensure-admin job missing from rendered chart" if ensure_admin.nil?

          ensure_admin_annotations = ensure_admin.dig("metadata", "annotations") || {}
          raise "ospere ensure-admin hook must run before install and upgrade" unless ensure_admin_annotations["helm.sh/hook"] == "pre-install,pre-upgrade"
          raise "ospere ensure-admin hook must run after migrations" unless ensure_admin_annotations["helm.sh/hook-weight"] == "16"

          ensure_admin_pod_spec = ensure_admin.dig("spec", "template", "spec")
          raise "ospere ensure-admin pod spec missing from rendered chart" if ensure_admin_pod_spec.nil?

          if ensure_admin_pod_spec.key?("serviceAccountName")
            raise "ospere pre-install ensure-admin hook must not reference chart-created serviceAccountName by default"
          end

          ensure_admin_container = ensure_admin_pod_spec.dig("containers", 0)
          raise "ospere ensure-admin container missing from rendered chart" if ensure_admin_container.nil?
          raise "ospere ensure-admin hook must use syncadmin" unless ensure_admin_container["command"] == ["python", "manage.py", "syncadmin"]

          admin_env = ensure_admin_container["env"] || []
          admin_secret_refs = admin_env.each_with_object({}) do |env_var, refs|
            next unless env_var["name"]&.start_with?("DJANGO_ADMIN_")

            refs[env_var["name"]] = env_var.dig("valueFrom", "secretKeyRef")
          end

          expected_admin_refs = {
            "DJANGO_ADMIN_USERNAME" => {"name" => "ospere-admin-bootstrap", "key" => "username"},
            "DJANGO_ADMIN_EMAIL" => {"name" => "ospere-admin-bootstrap", "key" => "email"},
            "DJANGO_ADMIN_PASSWORD" => {"name" => "ospere-admin-bootstrap", "key" => "password"},
          }

          raise "ospere ensure-admin hook must wire DJANGO_ADMIN_* from the bootstrap Secret" unless admin_secret_refs == expected_admin_refs

          service_account = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "ServiceAccount" && doc.dig("metadata", "name") == "ospere"
          end

          raise "ospere runtime service account missing from rendered chart" if service_account.nil?

          deployment = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "ospere"
          end

          raise "ospere deployment missing from rendered chart" if deployment.nil?

          web_container = deployment.dig("spec", "template", "spec", "containers", 0)
          raise "ospere web container missing from rendered chart" if web_container.nil?

          web_env = web_container["env"] || []
          env_by_name = web_env.each_with_object({}) { |env_var, refs| refs[env_var["name"]] = env_var }

          raise "ospere chart must render canonical MEF_CLIENT_SYSTEM_IDS" unless env_by_name.dig("MEF_CLIENT_SYSTEM_IDS", "value") == "client-system,client-system-secondary"
          raise "ospere chart must preserve compatibility MEF_CLIENT_SYSTEM_ID" unless env_by_name.dig("MEF_CLIENT_SYSTEM_ID", "value") == "client-system"
          RUBY

          secret_rendered="$(mktemp)"
          helm template ospere ./charts/ospere \
            --namespace ospere \
            --set database.host=postgres.example.com \
            --set aws.s3.artifactsBucket=ospere-artifacts \
            --set ospere.mef.cert.secretName=ospere-mef-client-cert-bundle \
            >"${secret_rendered}"

          ruby - "${secret_rendered}" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          docs = YAML.load_stream(File.read(path))
          deployment = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "ospere"
          end

          raise "ospere deployment missing from secret-backed rendered chart" if deployment.nil?

          web_container = deployment.dig("spec", "template", "spec", "containers", 0)
          raise "ospere web container missing from secret-backed rendered chart" if web_container.nil?

          web_env = web_container["env"] || []
          env_by_name = web_env.each_with_object({}) { |env_var, refs| refs[env_var["name"]] = env_var }

          expected_refs = {
            "MEF_CLIENT_SYSTEM_IDS" => {"name" => "ospere-mef-client-cert-bundle", "key" => "client_system_ids"},
            "MEF_CLIENT_SYSTEM_ID" => {"name" => "ospere-mef-client-cert-bundle", "key" => "client_system_id"},
            "MEF_EFIN" => {"name" => "ospere-mef-client-cert-bundle", "key" => "efin"},
            "MEF_ETIN" => {"name" => "ospere-mef-client-cert-bundle", "key" => "etin"},
            "MEF_SOFTWARE_ID" => {"name" => "ospere-mef-client-cert-bundle", "key" => "software_id"},
          }

          expected_refs.each do |name, expected|
            actual = env_by_name.dig(name, "valueFrom", "secretKeyRef")
            raise "ospere chart must render #{name} from the MeF cert Secret" unless actual == expected
          end

          raise "ospere chart must mount the MeF cert Secret" unless web_container["volumeMounts"]&.any? { |mount| mount["name"] == "mef-cert" }
          RUBY

          worker_rendered="$(mktemp)"
          helm template ospere ./charts/ospere \
            --namespace ospere \
            -f ./charts/ospere/ci/all-values.yaml \
            --set worker.enabled=true \
            --set worker.concurrency=5 \
            >"${worker_rendered}"

          ruby - "${worker_rendered}" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          docs = YAML.load_stream(File.read(path))
          deployment = docs.find do |doc|
            doc.is_a?(Hash) && doc["kind"] == "Deployment" && doc.dig("metadata", "name") == "ospere-worker"
          end

          raise "ospere worker deployment missing from rendered chart" if deployment.nil?

          worker_container = deployment.dig("spec", "template", "spec", "containers", 0)
          raise "ospere worker container missing from rendered chart" if worker_container.nil?

          worker_env = worker_container["env"] || []
          env_by_name = worker_env.each_with_object({}) { |env_var, refs| refs[env_var["name"]] = env_var }

          raise "ospere worker must render CELERY_WORKER_CONCURRENCY" unless env_by_name.dig("CELERY_WORKER_CONCURRENCY", "value") == "5"
          raise "ospere worker args must pass CELERY_WORKER_CONCURRENCY to Celery" unless worker_container["args"]&.include?("--concurrency=$(CELERY_WORKER_CONCURRENCY)")
          RUBY
