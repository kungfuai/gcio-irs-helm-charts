apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: jupyter-cpu
spec:
  # Template for nodes created by this pool
  template:
    metadata:
      labels:
        workload: jupyter
        type: cpu
    spec:
      # Node class to use
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Requirements for instance selection
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # Use spot for cost savings if desired
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "c", "m"]  # General purpose and compute optimized
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]  # Gen 5 and newer

  # Limits for this pool
  limits:
    cpu: 100    # Max 100 CPUs across all nodes in this pool
    memory: 200Gi

  # Disruption settings
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
