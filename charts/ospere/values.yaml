# Default values for ospere.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

ospere:
  logLevel: "INFO"
  # Runtime environment label for structured logs. If empty or unset, the chart
  # uses the release namespace.
  runtimeEnvironment: ""
  djangoSettingsModule: "ospere.settings.prod"
  debug: false
  allowedHosts: ""
  csrfTrustedOrigins: ""
  storageBackend: "s3"
  localStorageRoot: "/app/storage/artifacts"
  awsQuerystringExpire: 3600
  apiAuth:
    mode: "disabled"
    hawk:
      secretName: ""
      clientIdKey: "client_id"
      clientKeyKey: "client_key"
      algorithm: "sha256"
  # Outbound status notifications (ADR-0007). Ships dark: disabled by default,
  # so promoting a release without setting these leaves the feature off. When
  # enabled, url + the hmac credential are required. The hmac Secret is synced by
  # infra (Secrets Manager -> namespace Secret), never created by this chart —
  # same lifecycle as apiAuth.hawk. authMode is hmac-only today; none/bearer are
  # ADR targets and join here when the app reads NOTIFICATION_AUTH_MODE.
  notification:
    enabled: false
    url: ""
    hmac:
      secretName: ""
      clientIdKey: "client_id"
      clientSecretKey: "client_secret"
  mef:
    # test mode (default true) sends TestCd "T" to the IRS ATS; helmfile flips it
    # to false for production. endpointURL blank falls back to the app's ATS default.
    testMode: true
    clientSystemIDs: []
    clientSystemID: ""
    efin: ""
    etin: ""
    softwareIDsByTaxYear: {}
    defaultTaxYear: ""
    endpointURL: ""
    msiWSDL: "wsdl/MeFMSIServices.wsdl"
    transmitterWSDL: "wsdl/MeFTransmitterServicesMTOM.wsdl"
    cert:
      secretName: ""
      mountPath: "/var/run/ospere/mef"
      certKey: "cert.pem"
      privateKeyKey: "key.pem"
      clientSystemIDsKey: "client_system_ids"
      clientSystemIDKey: "client_system_id"
      efinKey: "efin"
      etinKey: "etin"
      softwareIDsByTaxYearKey: "software_ids_by_tax_year"

web:
  command: []
  args: []
  # Gunicorn concurrency, surfaced as env into docker/gunicorn.conf.py so the
  # image bakes no fixed worker count. Threaded (gthread) rather than sync: the
  # web surface is IO-bound (DB/S3/MeF waits), so threads keep the health probes
  # served while slow requests are in flight. Bumped above the image default
  # (2x4); helmfile overrides per environment.
  concurrency: 4
  threads: 8
  workerClass: "gthread"
  timeout: 60

worker:
  enabled: true
  replicaCount: 1
  concurrency: 5
  command: ["celery"]
  args: ["-A", "ospere", "worker", "--loglevel=INFO", "--concurrency=$(CELERY_WORKER_CONCURRENCY)"]
  resources: {}

beat:
  enabled: true
  replicaCount: 1
  command: ["celery"]
  args: ["-A", "ospere", "beat", "--loglevel=INFO"]
  resources: {}

aws:
  region: us-east-2
  s3:
    artifactsBucket: ""
    schemasBucket: ""
  endpointUrl: ""

database:
  name: "ospere"
  user: "postgres"
  host: ""
  port: "5432"

serviceAccount:
  create: true
  name: ""
  annotations: {}

secrets:
  create: false
  djangoSecretKey:
    name: ""
    key: "django-secret-key"
    value: ""
  postgresPassword:
    name: ""
    key: "postgres-password"
    value: ""
  celeryBrokerURL:
    name: ""
    key: "celery-broker-url"
    value: ""
  celeryResultBackend:
    name: ""
    key: "celery-result-backend"
    value: ""

jobs:
  migrate:
    create: true
    backoffLimit: 3
    # Pre-install/pre-upgrade migration hooks run before normal chart resources.
    # Leave empty so first installs can use the namespace default ServiceAccount.
    serviceAccountName: ""
  ensureAdmin:
    create: false
    backoffLimit: 3
    # Pre-install/pre-upgrade admin hooks run after locked migrations.
    # Leave empty so first installs can use the namespace default ServiceAccount.
    serviceAccountName: ""
    # Existing short-lived Secret created by the deployment workflow.
    existingSecret: ""
    usernameKey: "username"
    emailKey: "email"
    passwordKey: "password"

image:
  repository: 595425361112.dkr.ecr.us-east-2.amazonaws.com/ospere
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

pod:
  annotations: {}
  labels: {}
  securityContext: {}

containers:
  securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []

# Liveness must only catch a truly hung process, never a merely busy one — a
# restart drops in-flight work and makes load worse. The defaults (timeoutSeconds
# 1, failureThreshold 3) let a couple of slow requests starve the probe and trip a
# kill; an unset timeout/threshold inherits those. So liveness is deliberately
# slack: ~60s of unbroken unresponsiveness before a restart. Reacting to load is
# readiness's job (pull from the endpoints), not liveness's.
livenessProbe:
  httpGet:
    path: /livez
    port: 8000
    httpHeaders:
    - name: X-Kubernetes-Probe
      value: liveness
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
    httpHeaders:
    - name: X-Kubernetes-Probe
      value: readiness
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
