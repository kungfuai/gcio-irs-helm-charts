{{- if .Values.jobs.migrate.create -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ospere.fullname" . }}-migrate
  labels:
    {{- include "ospere.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "ospere.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- if .Values.jobs.migrate.serviceAccountName }}
      serviceAccountName: {{ .Values.jobs.migrate.serviceAccountName | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-migrate
          image: "{{ include "ospere.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containers.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          {{- include "ospere.environment" . | nindent 10 }}
            {{- include "ospere.serviceComponentEnv" (dict "component" "job.migrate") | nindent 12 }}
          {{- if .Values.ospere.mef.cert.secretName }}
          volumeMounts:
            - name: mef-cert
              mountPath: {{ .Values.ospere.mef.cert.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- if .Values.ospere.mef.cert.secretName }}
      volumes:
        - name: mef-cert
          secret:
            secretName: {{ .Values.ospere.mef.cert.secretName | quote }}
      {{- end }}
      restartPolicy: Never
  backoffLimit: {{ .Values.jobs.migrate.backoffLimit | default 5 }}
{{- end -}}
