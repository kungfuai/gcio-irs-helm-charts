# Default values for extractor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Name overrides: by default the name for most objects will be release-extractor. It is
# recommended to create a descriptive release name, but if you must override the names
# separate from the release, you can set nameOverride. To remove the -extractor suffix
# set the fullnameOverride to the name you want.
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Deployment update strategy
# Recreate: terminates old pod before starting new one (required for GPU services on single-node clusters)
# RollingUpdate: starts new pod before terminating old one (zero downtime but requires extra capacity)
updateStrategy:
  type: Recreate

extractor:
  logLevel: "INFO"
  rfdetrIrsStampStage1Checkpoint: ""  # Legacy - use MODEL_REGISTRY
  rfdetrIrsStampStage2Checkpoint: ""  # Legacy - use MODEL_REGISTRY

# OpenTelemetry
otel:
  endpoint: "http://cloudwatch-agent.amazon-cloudwatch:4316"

# AWS configuration
aws:
  region: us-east-2
  s3Bucket: ""  # Required - must be set per environment
  endpointUrl: ""  # Optional - for LocalStack/testing only

# Service account for IRSA (IAM Roles for Service Accounts)
serviceAccount:
  create: true
  name: ""  # If empty, uses the fullname
  annotations: {}  # Add eks.amazonaws.com/role-arn annotation via helmfile

secrets:
  create: false
  databaseURL:
    name: ""
    key: "database-url"
    value: ""

image:
  repository: 595425361112.dkr.ecr.us-east-2.amazonaws.com/facture-extractor
  pullPolicy: Always                 # Specify image pull policy (Always, IfNotPresent, Never).
  tag: ""                            # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []

# Additional pod spec configuration
pod:
  annotations: {}
  labels: {}
  securityContext: {}

# Additional container spec configuration
containers:
  securityContext: {}

service:
  type: ClusterIP
  port: 8000

# The liveness probe requires the facture service to be running.
livenessProbe:
  httpGet:
    path: /livez
    port: 8000
    httpHeaders:
    - name: X-Kubernetes-Probe
      value: liveness
  initialDelaySeconds: 2
  periodSeconds: 10

# The readiness probe requires the facture service to be running and connected to the database.
readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
    httpHeaders:
    - name: X-Kubernetes-Probe
      value: readiness
  initialDelaySeconds: 2
  periodSeconds: 10

# Pod requested resources and limits.
resources: {}

# Node selector for the pods.
nodeSelector: {}

# Tolerations for the pods.
tolerations: []

# Affinity rules for the pods.
affinity: {}