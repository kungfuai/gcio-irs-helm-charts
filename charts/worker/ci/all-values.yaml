aws:
  s3Bucket: "kfai-testing-cache"
  sqs:
    workerQueueURL: "kfai-testing-worker-queue-url"
    statusQueueURL: "kfai-testing-status-queue-url"
worker:
  notifier:
    enabled: true
    clientID: "kfai-testing-client-id"
    transcriptionURL: "https://example.test/integrations/kungfu-ai/task/transcription"
    wireMonikers:
      fbeta_2025: "FBETA_2025_10"
      falpha_2025_12: "FALPHA_2025_12"
secrets:
  notifierClientSecret:
    name: "kfai-testing-notifier"
# Exercise the opt-in Bedrock batch coordinator templates in CI lint.
bedrockBatch:
  enabled: true
  roleArn: "arn:aws:iam::000000000000:role/kfai-testing-bedrock-batch-inference"
  classify:
    enabled: true
  parse:
    enabled: true
