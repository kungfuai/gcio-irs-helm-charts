# Default values for worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Name overrides: by default the name for most objects will be release-worker. It is
# recommended to create a descriptive release name, but if you must override the names
# separate from the release, you can set nameOverride. To remove the -worker suffix
# set the fullnameOverride to the name you want.
nameOverride: ""
fullnameOverride: ""

# Replica count for the Deployment.
# Set to null to omit .spec.replicas from the rendered Deployment, which
# leaves replica count unmanaged by helm so kubectl scale or an HPA can own
# it without conflicting on the next sync. 0 is still rendered (scale to
# zero); only null omits the field.
replicaCount: 1

worker:
  extractorConfig: /app/config/pipeline.yaml
  # Parse recipe the Parse step runs: "full_schema" or "compact_schema".
  # Set per environment from kfai-infra; left empty here so the environment is
  # the only place it is decided. Empty means the env var is not rendered.
  parseRecipe: ""
  extractorCertPath: ""  # Optional - TLS cert for extractor service
  logLevel: "INFO"
  notifier:
    enabled: false
    drainQueue: false
    clientID: ""
    transcriptionURL: ""
    acknowledgementURL: ""
    issueURL: ""
    timeout: 30
    retries: 3
    # DaaS wire-moniker map: internal schema label -> the exact formMoniker
    # string Form Bridge's DB expects. Rendered to NOTIFIER_WIRE_MONIKERS as
    # JSON; empty map omits the env var and the worker emits internal labels
    # unchanged. Per-environment values own the real map.
    wireMonikers: {}
  sqs:
    maxRetries: 3
    maxMessages: 1
    maxQueueSize: 16
    waitSeconds: 30
    numWorkers: 1

# Bedrock batch inference coordinators (opt-in, OFF by default).
#
# When enabled, two additional Deployments run the SAME worker image with a
# different subcommand: a classification coordinator and a parse coordinator.
# They only do work when an experimental pipeline config uses the BatchClassify
# / BatchParse step classes; the regular worker pipeline is unaffected.
bedrockBatch:
  enabled: false
  # Bedrock batch inference service role passed to CreateModelInvocationJob
  # (terraform output bedrock_batch_inference_role_arn). Required when enabled.
  roleArn: ""
  # S3 bucket for batch JSONL artifacts. Optional; defaults to S3_BUCKET.
  bucket: ""
  # Bedrock model or inference profile ID. Optional; the coordinators fall
  # back to the app's classification/parser model config when unset.
  modelId: ""
  # Bedrock's minimum records per batch job.
  minRecords: 100
  # Default cap on real records claimed per job (latency + shard-size bound).
  maxRecords: 100
  # Oldest-record age before the under-minimum policy applies.
  maxWaitSeconds: 300
  # Seconds between coordinator submit/reconcile ticks.
  intervalSeconds: 30
  # What to do when maxWaitSeconds expires and the backlog is still under
  # minRecords:
  #
  #   wait_then_on_demand   - fall back to the regular on-demand call for the
  #                           under-minimum tail. This is the economically
  #                           honest default: batch only when a REAL backlog
  #                           reaches the Bedrock minimum, pay on-demand for
  #                           the trickle. No padding waste.
  #   wait_then_padded_batch- pad the job to minRecords with dummy records to
  #                           force batch pricing. Padding is NOT free: it only
  #                           wins when padding tokens < real tokens, the
  #                           margin is small even with minimal dummies, and it
  #                           evaporates if the dummy prompt grows. Treat as an
  #                           experiment-only knob.
  #   wait_only             - never fall back or pad; small trickles can stall
  #                           indefinitely.
  #
  # NOTE: this deliberately overrides the app CLI default
  # (wait_then_padded_batch). Revisit only after Cost Explorer confirms the
  # batch discount + real minimum for this model/partition.
  underMinimumPolicy: wait_then_on_demand
  classify:
    enabled: false
    replicaCount: 1
    command: ["python", "-m", "worker"]
    args: ["bedrock-batch-classify"]
    # Optional per-coordinator overrides of modelId/maxRecords/intervalSeconds.
    modelId: ""
    maxRecords: ""
    intervalSeconds: ""
    resources: {}
  parse:
    enabled: false
    replicaCount: 1
    command: ["python", "-m", "worker"]
    args: ["bedrock-batch-parse"]
    modelId: ""
    maxRecords: ""
    intervalSeconds: ""
    resources: {}

# AWS configuration
aws:
  region: us-east-2
  s3Bucket: ""  # Required - must be set per environment
  s3SyntheticDataBucket: ""  # Optional - synthetic/OCR output bucket
  sqs:
    workerQueueURL: ""
    statusQueueURL: ""
    resumeQueueURL: ""  # Optional - high-priority resume queue (Bedrock batch)
  endpointUrl: ""  # Optional - for LocalStack/testing only

# Service URLs (Kubernetes DNS)
services:
  extractor:
    url: "http://extractor.facture.svc.cluster.local:8000"

# Custom OTel metrics export (LLM token cost counters -> CloudWatch EMF).
# The CRD-injected auto-instrumentation disables the SDK metrics exporter by
# default; this re-enables it against the CloudWatch agent's OTLP receiver.
# Safe to leave on before the receiver exists (export fails silently).
otelMetrics:
  enabled: true
  endpoint: "http://cloudwatch-agent.amazon-cloudwatch:4318/v1/metrics"

# Service account for IRSA (IAM Roles for Service Accounts)
serviceAccount:
  create: true
  name: ""  # If empty, uses the fullname
  annotations: {}  # Add eks.amazonaws.com/role-arn annotation via helmfile

secrets:
  create: false
  databaseURL:
    name: ""
    key: "database-url"
    value: ""
  notifierClientSecret:
    name: ""
    # Backing Kubernetes Secret data key created by operations.
    key: "NOTIFIER_CLIENT_SECRET"

image:
  repository: 595425361112.dkr.ecr.us-east-2.amazonaws.com/facture-worker
  pullPolicy: Always                 # Specify image pull policy (Always, IfNotPresent, Never).
  tag: ""                            # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []

# Additional pod spec configuration
pod:
  annotations: {}
  labels: {}
  securityContext: {}

# Additional container spec configuration
containers:
  securityContext: {}

service:
  type: ClusterIP
  port: 8000

# Worker is a queue consumer. It does not expose an HTTP health surface by default.
livenessProbe: null
readinessProbe: null

# Pod requested resources and limits.
resources: {}

# Node selector for the pods.
nodeSelector: {}

# Tolerations for the pods.
tolerations: []

# Affinity rules for the pods.
affinity: {}
