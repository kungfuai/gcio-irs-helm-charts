# Default values for worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Name overrides: by default the name for most objects will be release-worker. It is
# recommended to create a descriptive release name, but if you must override the names
# separate from the release, you can set nameOverride. To remove the -worker suffix
# set the fullnameOverride to the name you want.
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

worker:
  extractorConfig: /app/config/pipeline.yaml
  extractorCertPath: ""  # Optional - TLS cert for extractor service
  logLevel: "INFO"
  sqs:
    maxRetries: 3
    maxMessages: 1
    maxQueueSize: 16
    waitSeconds: 30
    numWorkers: 1

# AWS configuration
aws:
  region: us-east-2
  s3Bucket: ""  # Required - must be set per environment
  s3SyntheticDataBucket: ""  # Optional - synthetic/OCR output bucket
  sqs:
    workerQueueURL: ""
    statusQueueURL: ""
  endpointUrl: ""  # Optional - for LocalStack/testing only

# Service URLs (Kubernetes DNS)
services:
  extractor:
    url: "http://extractor.facture.svc.cluster.local:8000"

# Service account for IRSA (IAM Roles for Service Accounts)
serviceAccount:
  create: true
  name: ""  # If empty, uses the fullname
  annotations: {}  # Add eks.amazonaws.com/role-arn annotation via helmfile

secrets:
  create: false
  databaseURL:
    name: ""
    key: "database-url"
    value: ""

image:
  repository: 595425361112.dkr.ecr.us-east-2.amazonaws.com/facture-worker
  pullPolicy: Always                 # Specify image pull policy (Always, IfNotPresent, Never).
  tag: ""                            # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []

# Additional pod spec configuration
pod:
  annotations: {}
  labels: {}
  securityContext: {}

# Additional container spec configuration
containers:
  securityContext: {}

service:
  type: ClusterIP
  port: 8000

# Worker is a queue consumer. It does not expose an HTTP health surface by default.
livenessProbe: null
readinessProbe: null

# Pod requested resources and limits.
resources: {}

# Node selector for the pods.
nodeSelector: {}

# Tolerations for the pods.
tolerations: []

# Affinity rules for the pods.
affinity: {}
